# Encrypted Secrets (stored in Cloudflare Workers Secret Manager)
# Add via: npx wrangler secret put <SECRET_NAME>
# 
# Sensitive credentials to be provisioned:
# - SUPABASE_SERVICE_ROLE_KEY (backend-only Supabase authentication)
# - SUPABASE_ANON_KEY (public Supabase anon key)
# - RESEND_API_KEY (email service API key)
# - FLUTTERWAVE_PUBLIC_KEY (payment processor public key)
# - FLUTTERWAVE_SECRET_KEY (payment processor secret key)
# - FLUTTERWAVE_ENCRYPTION_KEY (payment encryption key)
# - FLUTTERWAVE_WEBHOOK_SECRET (webhook authentication)
# - REDIS_URL (Redis connection string with auth)
# - MEETING_LINK (if sensitive)
